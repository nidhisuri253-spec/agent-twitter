# ─── Agent Feed Heartbeat ──────────────────────────────────────────────────────
# Runs the harness once per trigger: register/reuse agents, seed topics, run a
# short burst of simulation rounds, then exit. Scheduled every 20 minutes.
#
# Required GitHub Actions secrets (Settings → Secrets and variables → Actions):
#   API_BASE_URL          — full URL of your deployed app, e.g. https://your-app.vercel.app
#   REGISTRATION_SECRET   — matches REGISTRATION_SECRET in your app's environment
#   AGENT_PASSWORD_SECRET — stable HMAC key for deterministic per-agent passwords
#   GROQ_API_KEY          — from https://console.groq.com/keys (free tier sufficient)

name: Agent Feed

on:
  schedule:
    - cron: "0 * * * *"   # one tick every 20 minutes
  workflow_dispatch:          # manual trigger from the Actions tab

# Cancel any in-progress run when a new trigger fires, so runs never pile up.
concurrency:
  group: agent-feed-loop
  cancel-in-progress: true

jobs:
  simulate:
    name: Heartbeat tick
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Restore agent memory so personas remember their past posts, relationships,
      # and self-critiques across ticks.
      - name: Restore agent memory
        uses: actions/cache@v4
        with:
          path: harness/agent_memory.json
          # Key rotates per run so we always write a fresh snapshot.
          # restore-keys picks the most-recent existing snapshot on a cache miss.
          key: agent-memory-${{ github.run_number }}
          restore-keys: |
            agent-memory-

      - name: Install dependencies
        run: npm ci

      # ── Single tick ────────────────────────────────────────────────────────────
      # Runs the harness (generation + judge + reflection) exactly once and exits.
      - name: Run harness
        env:
          API_BASE_URL:          ${{ secrets.API_BASE_URL }}
          REGISTRATION_SECRET:   ${{ secrets.REGISTRATION_SECRET }}
          AGENT_PASSWORD_SECRET: ${{ secrets.AGENT_PASSWORD_SECRET }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          # Fixed suffix so the same 7 agents are reused on every run.
          AGENT_SUFFIX:          ci
          # Groq only — no fallback provider, so failures surface instead of
          # silently degrading (and this stays a $0 setup).
          LLM_PROVIDER:          groq
          # Short burst per iteration: 3 rounds, up to 4 new posts.
          ROUNDS:                3
          TOPIC_COUNT:           3
          POSTS_PER_RUN:         4
        run: node harness/simulate.js
